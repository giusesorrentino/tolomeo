ci:
  autofix_commit_msg: "chore: pre-commit fixes"
  autofix_prs: false
  autoupdate_schedule: 'monthly'
  autoupdate_commit_msg: "chore: bump pre-commit hooks"

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: ["--enforce-all", "--maxkb=300"]
        exclude: "^(uv\\.lock|.*\\.fits|.*/resources/.*)$"
        # Prevent giant files from being committed.
      - id: check-case-conflict
        # Check for files with names that would conflict on a case-insensitive
        # filesystem like MacOS HFS+ or Windows FAT.
      - id: check-json
        # Attempts to load all json files to verify syntax.
      - id: check-merge-conflict
        # Check for files that contain merge conflict strings.
      - id: check-symlinks
        # Checks for symlinks which do not point to anything.
      - id: check-yaml
        # Attempts to load all yaml files to verify syntax.
        exclude: "^(\\.github/ISSUE_TEMPLATE/|\\.github/PULL_REQUEST_TEMPLATE/)"
      - id: detect-private-key
        # Checks for the existence of private keys.
      - id: end-of-file-fixer
        # Makes sure files end in a newline and only a newline.
        exclude: ".*(|icenses.*|LICENSE|_static.*|(^|/)meson\\.build)$"
      - id: mixed-line-ending
        args: ["--fix=lf"]
        # Forces all text files to use LF line endings.
        exclude: ".*(licenses.*|LICENSE|_static.*|docs/make\\.bat)$"
      # - id: fix-encoding-pragma  # covered by pyupgrade
      - id: trailing-whitespace
        # Trims trailing whitespace.
        exclude_types: [python]  # Covered by Ruff W291.
        exclude: ".*(licenses.*|LICENSE|_static.*)$"

  - repo: https://github.com/pre-commit/pygrep-hooks
    rev: v1.10.0
    hooks:
      - id: rst-directive-colons
        # Detect mistake of rst directive not ending with double colon.
      - id: rst-inline-touching-normal
        # Detect mistake of inline code touching normal text in rst.
      - id: text-unicode-replacement-char
        # Forbid files which have a UTF-8 Unicode replacement character.

  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: v1.30.0
    hooks:
      - id: zizmor

  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.3
    hooks:
      - id: codespell
        args: ["--write-changes"]
        additional_dependencies:
          - tomli

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.6
    hooks:
      - id: ruff-check
        args: ["--fix", "--show-fixes"]
      - id: ruff-format
        exclude: ".*\\.md$"

  - repo: https://github.com/hukkin/mdformat
    rev: "1.0.0"
    hooks:
      - id: mdformat
        additional_dependencies:
          - mdformat-gfm
          - mdformat-footnote
          - mdformat-gfm-alerts

  - repo: https://github.com/scientific-python/cookie
    rev: 2026.08.14
    hooks:
      - id: sp-repo-review

  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: 'v22.1.8'
    hooks:
      - id: clang-format
        files: \.(c|h)$

  - repo: https://github.com/fortran-lang/fprettify
    rev: v0.3.7
    hooks:
      - id: fprettify
        args: ["--indent", "4", "--whitespace", "2"]