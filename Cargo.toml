[package]
name = "roma"
version = "0.1.0"
edition = "2021"

[lib]
name = "roma"
crate-type = ["cdylib", "rlib"]

[dependencies]
log = "0.4"
pyo3 = { version = "0.30.1", features = ["extension-module"] }
numpy = "0.30.0"
rayon = "1.10"
rustfft = "6.2"
realfft = "3.5.0"

[profile.release]
strip = false