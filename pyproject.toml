[build-system]
build-backend = "maturin"
requires = ["maturin>=1.0,<2.0"]

[tool.maturin]
python-source = "python"
module-name = "tolomeo._core"

[project]
name = "tolomeo"
version = "0.1.0.dev0"
description = "A general-purpose mapmaker for radio telescopes."
readme = "README.md"
license = "MPL-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "Giuseppe Sorrentino", email = "166509923+giusesorrentino@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "astropy>=8.0.1",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pydantic>=2.14.1",
    "pyyaml>=6.0.3",
    "scipy>=1.18.1",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Rust",
    "Topic :: Software Development :: Libraries",
    "Topic :: Scientific/Engineering",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: POSIX",
    "Operating System :: Unix",
    "Operating System :: MacOS",
]

[dependency-groups]
build = [
    "maturin>=1.15.0",
]
dev = [
    "ipykernel>=7.4.0",
    "pre-commit>=4.6.2",
    "ruff>=0.17.0",
    "spin>=0.18",
]

[tool.uv]
default-groups = ["dev", "build"]

[tool.spin]
package = "tolomeo"

[tool.spin.commands]
"Build & Develop" = [
    ".spin/cmds.py:build",
    ".spin/cmds.py:lint",
    ".spin/cmds.py:smoke",
    ".spin/cmds.py:test",
]
