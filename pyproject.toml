[build-system]
requires = ["uv_build>=0.12.24,<0.13.0"]
build-backend = "uv_build"

[project]
name = "tolomeo"
version = "0.1.0.dev0"
description = "A maximum-likelihood mapmaker for MISTRAL based on ROMA."
readme = "README.md"
license = "MPL-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "Giuseppe Sorrentino", email = "166509923+giusesorrentino@users.noreply.github.com" },
]
requires-python = ">=3.12"
dependencies = [
    "astropy>=8.0.1",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pydantic>=2.14.1",
    "pyyaml>=6.0.3",
    "scipy>=1.18.1",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Software Development :: Libraries",
    "Topic :: Scientific/Engineering",
    "Operating System :: OS Independent",
]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "pre-commit>=4.6.2",
    "pytest>=9.2.0",
    "ruff>=0.17.0",
    "spin>=0.18",
]

[tool.spin]
package = "tolomeo"

[tool.spin.commands]
"Build & Develop" = [
    ".spin/cmds.py:lint",
    ".spin/cmds.py:smoke",
    ".spin/cmds.py:test",
]

[project.scripts]
tolomeo = "tolomeo._cli:main"
