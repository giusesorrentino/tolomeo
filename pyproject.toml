[build-system]
requires = ["uv_build>=0.12.24,<0.14.0"]
build-backend = "uv_build"

[project]
name = "tolomeo"
version = "0.1.0.dev0"
description = "A maximum-likelihood mapmaker for MISTRAL based on ROMA."
readme = "README.md"
license = "MPL-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "Giuseppe Sorrentino", email = "166509923+giusesorrentino@users.noreply.github.com" },
]
requires-python = ">=3.12"
dependencies = [
    "astropy>=8.0.1",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pydantic>=2.14.1",
    "pyyaml>=6.0.3",
    "scipy>=1.18.1",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Software Development :: Libraries",
    "Topic :: Scientific/Engineering",
    "Operating System :: OS Independent",
]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "pre-commit>=4.6.2",
    "pytest>=9.2.0",
    "ruff>=0.17.0",
    "spin>=0.18",
]

[tool.spin]
package = "tolomeo"

[tool.spin.commands]
"Build & Develop" = [
    ".spin/cmds.py:lint",
    ".spin/cmds.py:smoke",
    ".spin/cmds.py:test",
]

[project.scripts]
tolomeo = "tolomeo._cli:main"

[tool.pytest]
testpaths = [
    "tests",
]
minversion = "9"
log_level = "INFO"
strict = true
addopts = ["-ra", "--ignore=tests/smoke_test.py"]
filterwarnings = [
    "error",
    # read_scan and read_skydip start a ProcessPoolExecutor: on Linux with Python 3.12
    # and 3.13 it forks, and Python warns if the process already has threads (BLAS)
    'ignore:This process \(pid=\d+\) is multi-threaded, use of fork\(\):DeprecationWarning',
    # free-threaded Python: a compiled module of a dependency (astropy.io.fits) that
    # does not declare it can run without the GIL turns the GIL back on, and warns
    'ignore:The global interpreter lock \(GIL\) has been enabled:RuntimeWarning',
]

[tool.repo-review]
ignore = [
    "PY004",  # no docs folder yet
    "GH100",  # no GitHub Actions yet
    "MY100",  # tolomeo currently does not use a type checker
    "PC140",  # tolomeo currently does not use a type checker
]

[tool.ruff]
include = [
    "src/**/*.py",
    "tests/**/*.py",
    "pyproject.toml",
]

[tool.ruff.lint]
extend-select = [
    "B",
    "I",
    "UP",
]
