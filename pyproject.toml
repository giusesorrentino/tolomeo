[build-system]
build-backend = "mesonpy"
requires = [
    "meson-python>=0.15.0",
    "numpy>=2.0.0",
]

[project]
name = "tolomeo"
version = "0.1.0.dev0"
description = "A general-purpose mapmaker for radio telescopes."
readme = "README.md"
license = "MPL-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "Giuseppe Sorrentino", email = "166509923+giusesorrentino@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "astropy>=8.0.1",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pyyaml>=6.0.3",
    "scipy>=1.18.1",
]

[dependency-groups]
build = [
    "meson-python>=0.22.1",
    "ninja>=1.13.2",
]
dev = [
    "pre-commit>=4.6.2",
    "ruff>=0.17.0",
    "spin>=0.18",
]

[tool.uv]
default-groups = ["dev", "build"]

[tool.spin]
package = "tolomeo"

[tool.spin.commands]
"Build & Develop" = [
    ".spin/cmds.py:build",
    ".spin/cmds.py:lint",
    ".spin/cmds.py:smoke",
    ".spin/cmds.py:test",
]
